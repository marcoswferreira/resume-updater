name: Sync Profile README

on:
  push:
    branches: [ main ]
    paths:
      - 'curriculum/resume_en-us.md'
      - 'scripts/sync-profile.mjs'
      - '.github/workflows/sync-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-updater repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for PROFILE_SYNC_PAT secret
        id: check_token
        run: |
          if [ -z "${{ secrets.PROFILE_SYNC_PAT }}" ]; then
            echo "::warning title=Missing PROFILE_SYNC_PAT::Secret PROFILE_SYNC_PAT was not found. Please create a Personal Access Token with repo access to 'marcoswferreira/marcoswferreira' and add it in Settings > Secrets and variables > Actions."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout profile repository
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'marcoswferreira/marcoswferreira'
          token: ${{ secrets.PROFILE_SYNC_PAT }}
          path: 'profile-repo'

      - name: Generate & Update Profile README
        if: steps.check_token.outputs.has_token == 'true'
        run: node scripts/sync-profile.mjs profile-repo/README.md

      - name: Commit and push changes to profile repository
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: profile-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes detected in profile README. Everything is up to date."
          else
            git commit -m "chore(profile): sync README with resume_en-us [skip ci]"
            git push
            echo "Successfully synced profile README!"
          fi
